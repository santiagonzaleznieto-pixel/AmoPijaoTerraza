function cropFile(file,ratio,shape){return new Promise(resolve=>{
 const rd=new FileReader();
 rd.onload=()=>{
  const im=new Image();
  im.onload=()=>{
  const bg=document.createElement('div');bg.className='crop-bg';
  const fw=Math.min(360,window.innerWidth-64),fh=fw/ratio;
  bg.innerHTML=`<div class="crop-box"><h2 style="font-size:18px">Ajusta la foto</h2><p class="note">Arrastra para mover, usa la barra para acercar. Así se verá en la página.</p><div class="crop-frame" style="width:${fw}px;height:${fh}px;border-radius:${shape=='circle'?'50%':'var(--arch)'}"><img></div><input type="range" min="100" max="300" value="100" id="zm"><div style="display:flex;gap:8px;margin-top:12px"><button class="btn ghost" id="cc" style="flex:1">Cancelar</button><button class="btn" id="ok" style="flex:1">Usar esta foto</button></div></div>`;
  document.body.appendChild(bg);
  const frame=bg.querySelector('.crop-frame'),img=bg.querySelector('img'),zm=bg.querySelector('#zm');
  const base=Math.max(fw/im.width,fh/im.height);let s=base,x=(fw-im.width*s)/2,y=(fh-im.height*s)/2;
  const clamp=()=>{const w=im.width*s,h=im.height*s;x=Math.min(0,Math.max(fw-w,x));y=Math.min(0,Math.max(fh-h,y))};
  const draw=()=>{clamp();img.style.width=(im.width*s)+'px';img.style.height=(im.height*s)+'px';img.style.transform=`translate(${x}px,${y}px)`};
  img.src=rd.result;draw();
  let drag=null;
  frame.addEventListener('pointerdown',e=>{drag={sx:e.clientX-x,sy:e.clientY-y};frame.setPointerCapture(e.pointerId)});
  frame.addEventListener('pointermove',e=>{if(!drag)return;x=e.clientX-drag.sx;y=e.clientY-drag.sy;draw()});
  frame.addEventListener('pointerup',()=>drag=null);
  zm.oninput=()=>{const ns=base*(zm.value/100),cx=fw/2-x,cy=fh/2-y,r=ns/s;s=ns;x=fw/2-cx*r;y=fh/2-cy*r;draw()};
  bg.querySelector('#cc').onclick=()=>{bg.remove();resolve(null)};
  bg.querySelector('#ok').onclick=()=>{
   const OW=ratio>=1?900:Math.round(900*ratio),OH=Math.round(OW/ratio),c=document.createElement('canvas');c.width=OW;c.height=OH;
   const ctx=c.getContext('2d'),k=OW/fw;
   ctx.drawImage(im,x*k,y*k,im.width*s*k,im.height*s*k);
   c.toBlob(b=>{bg.remove();resolve(b)},'image/jpeg',.82)};
  };
  im.src=rd.result;
 };
 rd.readAsDataURL(file);
})}
