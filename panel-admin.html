const vM=()=>M.map((c,i)=>{const cs=c.cols;return`<details class="card" data-id="${c.id}" ${OP.has(c.id)?'open':''}><summary>${E(c.emoji)} ${E(c.name)}<span>${(c.items||[]).length} ítems</span></summary><div class="cat"><input data-c="${i}" data-f="emoji" value="${E(c.emoji)}"><input data-c="${i}" data-f="name" value="${E(c.name)}"><button class="x" data-a="dc" data-c="${i}" title="Eliminar categoría">🗑</button></div>`+(c.items||[]).map((it,j)=>`<div class="it${cs?' b':''}"><input class="nm" data-c="${i}" data-j="${j}" data-f="n" value="${E(it.n)}" placeholder="Nombre">`+(cs?cs.map((x,k)=>`<input data-c="${i}" data-j="${j}" data-v="${k}" value="${E((it.v||[])[k])}" placeholder="${x}">`).join(''):`<input class="ds" data-c="${i}" data-j="${j}" data-f="d" value="${E(it.d)}" placeholder="Descripción (opcional)"><input data-c="${i}" data-j="${j}" data-f="p" value="${E(it.p)}" placeholder="$0" inputmode="numeric">`)+`<button class="x" data-a="di" data-c="${i}" data-j="${j}">×</button></div>`).join('')+`<button class="btn ghost" data-a="ai" data-c="${i}">＋ Agregar ${cs?'fila':'plato'}</button></details>`}).join('')+`<button class="btn" data-a="ac">＋ Nueva categoría</button>`;
const vS=()=>`<p class="note">Aquí publicas lo que vendes (imanes, tazas, etc.). Solo los productos marcados como “Publicado” aparecen en el sitio.</p><div class="grid">`+SH.map((p,i)=>`<div class="card"><label class="ph">${p.img?`<img src="${E(p.img)}" alt="">`:'<span>📷 Toca para agregar la foto</span>'}<input type="file" accept="image/*" data-img="shop" data-s="${i}"></label><label>Nombre</label><input data-s="${i}" data-f="name" value="${E(p.name)}" placeholder="Imán de Pijao, Taza…"><label>Precio</label><input data-s="${i}" data-f="price" value="${E(p.price)}" inputmode="numeric" placeholder="$0"><label>Descripción</label><textarea data-s="${i}" data-f="desc">${E(p.desc)}</textarea><label class="chk"><input type="checkbox" data-s="${i}" data-f="on" ${p.on?'checked':''}> Publicado en el sitio</label><label class="chk"><input type="checkbox" data-s="${i}" data-f="out" ${p.out?'checked':''}> Agotado</label><button class="btn ghost" style="margin-top:12px;color:#B3261E" data-a="ds" data-s="${i}">Eliminar producto</button></div>`).join('')+`</div><button class="btn" data-a="as">＋ Nuevo producto</button>`;
const vF=()=>[['hero','Foto principal (portada)'],['about','Foto de “Nuestra historia”']].map(([k,l])=>`<div class="card" style="max-width:460px"><label style="margin-top:0">${l}</label><label class="ph">${IM[k]?`<img src="${E(IM[k])}" alt="">`:'<span>📷 Toca para cambiarla (si no subes una, el sitio conserva la actual)</span>'}<input type="file" accept="image/*" data-img="${k}"></label></div>`).join('');
function render(){const a=document.activeElement;if(!S||(a&&a.closest('main')&&/INPUT|TEXTAREA/.test(a.tagName)))return;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));$('main').innerHTML='<p class="note">Los cambios se guardan solos y se ven de inmediato en la página principal.</p>'+{textos:vT,menu:vM,tienda:vS,fotos:vF}[tab]()}
async function load(){const R=await api('/rest/v1/content?select=col,id,position,data&order=position');if(!R.some(r=>r.col=='meta'))return seed();
T=(R.find(r=>r.col=='site')||{}).data||{};IM={};M=[];SH=[];R.forEach(r=>{if(r.col=='img')IM[r.id]=r.data.src;else if(r.col=='menu')M.push({id:r.id,position:r.position,...r.data});else if(r.col=='shop')SH.push({id:r.id,position:r.position,...r.data})});render()}
async function seed(){st('Cargando el menú actual…');await upsert([{col:'site',id:'texts',position:0,data:SEED.texts},...SEED.menu.map((c,i)=>{const{order,...d}=c;return{col:'menu',id:'c'+String(i).padStart(2,'0'),position:i,data:d}}),{col:'meta',id:'seeded',position:0,data:{}}]);return load()}
async function start(){$('#hb').hidden=$('#tb').hidden=false;st('Conectado');try{await load()}catch(e){if(!S)return;st('Sin conexión',1);$('main').innerHTML='<div class="card lock"><h2>Sin conexión</h2><p>No se pudo leer la información. Revisa el internet y pulsa «Actualizar».</p></div>'}}
document.addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.id)d.open?OP.add(d.dataset.id):OP.delete(d.dataset.id)},true);
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='pw')$('[data-a=in]').click()});
document.addEventListener('change',async e=>{const t=e.target,D=t.dataset;if(!S||!t.closest('main'))return;
if(D.k){T[D.k]=t.type=='checkbox'?t.checked:t.value;return put('site','texts',0,T)}
if(D.img){const f=t.files[0];if(!f)return;try{st('Subiendo foto…');const u=await upl(await shrink(f,D.img=='hero'?1000:D.img=='about'?600:640,.75));if(D.img=='shop'){const p=SH[D.s];p.img=u;await sv('shop',p)}else{IM[D.img]=u;await put('img',D.img,0,{src:u})}t.blur();render()}catch(x){st('No se pudo subir la foto',1)}return}
if(D.c!=null){const c=M[D.c];if(D.j==null)c[D.f]=t.value;else{const it=c.items[D.j];if(D.v!=null){it.v=it.v||[];it.v[D.v]=money(t.value)}else it[D.f]=D.f=='p'?money(t.value):t.value}return sv('menu',c)}
if(D.s!=null){const p=SH[D.s],f=D.f;p[f]=t.type=='checkbox'?t.checked:f=='price'?money(t.value):t.value;sv('shop',p)}});
document.addEventListener('click',async e=>{const t=e.target.closest('[data-a],[data-t]');if(!t)return;const D=t.dataset,c=M[D.c],a=D.a;
if(a=='in'){try{st('Entrando…');await tok({email:$('#em').value.trim(),password:$('#pw').value},'password');start()}catch(x){login('Correo o contraseña incorrectos')}return}
if(!S)return;
if(D.t){tab=D.t;return render()}
if(a=='ou')return login();
if(a=='rl')return load();
if(a=='pw'){const p=prompt('Escribe la nueva contraseña (mínimo 8 caracteres):');if(p&&p.length>=8){try{await api('/auth/v1/user',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p})});st('Contraseña cambiada ✓')}catch(x){st('No se pudo cambiar',1)}}return}
if(a=='ai'){(c.items=c.items||[]).push(c.cols?{n:'',v:['','','']}:{n:'',d:'',p:''});OP.add(c.id);await sv('menu',c);render()}
if(a=='di'&&sure(t)){c.items.splice(D.j,1);await sv('menu',c);render()}
if(a=='dc'&&sure(t))del('menu',c.id);
if(a=='ac'){const id='c'+nid();OP.add(id);await put('menu',id,Math.max(-1,...M.map(m=>m.position))+1,{name:'Nueva categoría',emoji:'🍽️',items:[]});await load()}
if(a=='as'){await put('shop','p'+nid(),Date.now(),{name:'',price:'',desc:'',img:'',on:false,out:false});await load()}
if(a=='ds'&&sure(t))del('shop',SH[D.s].id)});
S?start():login();
</script></body></html>
